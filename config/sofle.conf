# Configuration override key
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Configuration encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# BLE transmit power configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix Windows battery reporting bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Power management configuration
CONFIG_ZMK_IDLE_TIMEOUT=240000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# Wake configuration
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_USB=y

# ZMK Studio configuration
CONFIG_ZMK_STUDIO_LOCKING=n
# Intel support
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Improve BLE connection stability
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Do not clear bonds on boot
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n


# CUSTOM OLED SETTINGS START HERE 2026-SEP-29

# Turn OFF standard ZMK widgets so they don't clash with nice_oled's custom ones
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Optimize Bluetooth connection interval for split halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_ZMK_WIDGET_LAYER_STATUS=n

# Force standard 1M PHY to clear up Windows Bluetooth latency
CONFIG_BT_CTLR_PHY_2M=n

# Disable animation widgets from zmk-nice-oled
CONFIG_NICE_OLED_WIDGET_ANIMATION=n
CONFIG_NICE_OLED_WIDGET_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_LUNA=n
