# Configuration override key
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Configuration encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# BLE transmit power configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix Windows battery reporting bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Power management configuration
CONFIG_ZMK_IDLE_TIMEOUT=240000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# Wake configuration
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_USB=y

# ZMK Studio configuration
CONFIG_ZMK_STUDIO_LOCKING=n
# Intel support
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# RGB backlight configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Auto turn off RGB when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Improve BLE connection stability
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251


# Do not clear bonds on boot
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n


# CUSTOM OLED SETTINGS START HERE 2026-SEP-29

# Show battery percentage instead of an icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Show Bluetooth active profile and connection status
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Show a numerical WPM counter
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Tell ZMK to listen to the computer for Capslock/Numlock status
CONFIG_ZMK_HID_INDICATORS=y

# Tell the OLED to display the Capslock status (from the Luna module)
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ONLY_CAPSLOCK=y

